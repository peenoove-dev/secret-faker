# ใช้กับ Render.com (แพลนฟรี): New → Blueprint → เลือก repo นี้
services:
  - type: web
    name: secret-faker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # ตั้งรหัสผู้สร้างเองใน Render → Environment (ห้ามใส่ค่าจริงในไฟล์นี้)
      - key: CREATOR_CODE
        sync: false
      # บัญชีผู้สร้างระดับตำนาน (เลเวล 999 + ความสำเร็จครบ + เอฟเฟกต์โปรไฟล์) — สร้างใหม่ให้ทุกครั้งที่เซิร์ฟเวอร์เปิด
      - key: CREATOR_USER
        sync: false
      - key: CREATOR_PASS
        sync: false
      # (แนะนำ) ที่เก็บข้อมูลถาวรฟรีจาก upstash.com → สร้าง Redis แล้วคัดลอก REST URL / REST TOKEN มาใส่
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
